<section class="research-story">
  <div class="research-story__copy">
    <h2>{{ .Get "title" }}</h2>
    <div class="research-story__body">{{ .Inner | markdownify }}</div>
  </div>
  <div class="research-story__media">
    <figure>
      {{ partial "responsive-image.html" (dict
        "path" (.Get "image")
        "alt" (.Get "alt")
        "width" (.Get "width")
        "height" (.Get "height")
        "sizes" "(min-width: 1000px) 520px, 100vw"
        "widths" (slice 520 1040)) }}
      {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
    </figure>
    {{ with .Get "image2" }}
      <figure>
        {{ partial "responsive-image.html" (dict
          "path" .
          "alt" ($.Get "alt2")
          "width" ($.Get "width2")
          "height" ($.Get "height2")
          "sizes" "(min-width: 1000px) 520px, 100vw"
          "widths" (slice 520 1040)) }}
        {{ with $.Get "caption2" }}<figcaption>{{ . }}</figcaption>{{ end }}
      </figure>
    {{ end }}
  </div>
</section>
