# lmxu.cc — SCOPE Group bilingual Hugo site (static).
#   client -> Cloudflare (orange, Full strict) -> nginx :443 -> /var/www/scope-web
# TLS: Let's Encrypt (lmxu.cc + www.lmxu.cc) via the certbot cloudflare DNS-01 plugin.
server {
    listen 80;
    listen [::]:80;
    server_name lmxu.cc www.lmxu.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # HTTP/3 stays off for the same mainland-UDP throttling reason as api.lmxu.cc.
    server_name lmxu.cc www.lmxu.cc;
    ssl_certificate     /etc/nginx/tls/lmxu.cc.pem;
    ssl_certificate_key /etc/nginx/tls/lmxu.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lmxu_web_tls:10m;
    ssl_session_timeout 1d;
    # Cloudflare Authenticated Origin Pulls: only requests carrying Cloudflare's
    # origin-pull client certificate reach this vhost. A direct connection to the
    # host with a forged Host header fails the TLS handshake and never gets here.
    # The CA is the shared public one (CN=origin-pull.cloudflare.net); renewals of
    # it require refreshing /etc/nginx/tls/authenticated_origin_pull_ca.pem.
    ssl_client_certificate /etc/nginx/tls/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;
    # One canonical host: www redirects to the apex, so hreflang/canonical never split.
    if ($host = www.lmxu.cc) {
        return 301 https://lmxu.cc$request_uri;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No inline scripts anywhere; the only inline CSS is three object-position
    # attributes. Cloudflare's email-decode script is same-origin (/cdn-cgi/).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    root /var/www/scope-web;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/lmxu.cc.access.log;
    error_log  /var/log/nginx/lmxu.cc.error.log warn;
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }
    location ^~ /css/ {
        expires 1y;
        try_files $uri =404;
    }
    location ^~ /js/ {
        expires 1y;
        try_files $uri =404;
    }
    location ^~ /media/ {
        expires 90d;
        try_files $uri =404;
    }
    location / {
        # HTML must revalidate so a deploy is visible immediately; Cloudflare does
        # not cache it (cf-cache-status: DYNAMIC) and browsers should not guess.
        expires -1;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
